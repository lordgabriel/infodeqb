                <tr><th colspan="2" style="background:#2475ba;color:#fff;padding:6px 8px;text-align:left;font-size:13px;">{valorlabel_section}</th></tr>
                <tr style="background:#f0f5fb;"><td style="padding:4px 8px;color:#555;width:40%;border-bottom:1px solid #dde6f0;">{valorlabel_nome}:</td><td style="padding:4px 8px;border-bottom:1px solid #dde6f0;">{valornome}</td></tr>

                <tr><td style="padding:4px 8px;color:#555;border-bottom:1px solid #dde6f0;">{valorlabel_fim}:</td><td style="padding:4px 8px;border-bottom:1px solid #dde6f0;">{valorfim}</td></tr>
                <tr style="background:#f0f5fb;"><td style="padding:4px 8px;color:#555;">{valorlabel_tipo}:</td><td style="padding:4px 8px;">{valortipo}</td></tr>

              <p style="font-size:12px;color:#777;margin:0;">{valormsg_footer}</p>
