              <table style="width:100%;font-size:13px;border-collapse:collapse;margin-bottom:12px;">
                <tr><th colspan="2" style="background:#2475ba;color:#fff;padding:6px 8px;text-align:left;font-size:13px;">Dados do Pedido</th></tr>

                <tr><td style="padding:4px 8px;color:#555;border-bottom:1px solid #dde6f0;">Código FEUP:</td><td style="padding:4px 8px;border-bottom:1px solid #dde6f0;">{valorcodigo}</td></tr>
                <tr style="background:#f0f5fb;"><td style="padding:4px 8px;color:#555;">Tipo de alteração:</td><td style="padding:4px 8px;">{valordetalhe}</td></tr>

              <p style="font-size:12px;color:#777;margin:0;">Será notificado por email quando o pedido for processado.</p>
