<!-- EMAIL_SUBTITLE: Atualização de Acessos -->
{{HEADER}}
              <p style="margin:0 0 12px 0;font-size:16px;line-height:24px;font-family:Arial,sans-serif;">Caro Colega,</p>
              <p style="margin:0 0 20px 0;font-size:16px;line-height:24px;font-family:Arial,sans-serif;">Vimos por este meio solicitar a <strong>atualização</strong> dos acessos no edifício E (DEQ) para o colaborador abaixo indicado.</p>

              <!-- Dados do colaborador -->
              <table border="0" cellpadding="6" cellspacing="0" style="width:100%;border-collapse:collapse;font-family:Arial,sans-serif;font-size:15px;margin-bottom:24px;">
                <thead>
                  <tr>
                    <th align="left" style="background:#2475ba;color:#fff;padding:8px;">Código</th>
                    <th align="left" style="background:#2475ba;color:#fff;padding:8px;">Nome</th>
                    <th align="left" style="background:#2475ba;color:#fff;padding:8px;">Data Fim</th>
                    <th align="left" style="background:#2475ba;color:#fff;padding:8px;">Responsável</th>
                  </tr>
                </thead>
                <tbody>
                  <tr>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorcodigo}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valornome}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorfim}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorresponsavel}</td>
                  </tr>
                </tbody>
              </table>

              <!-- Secção dinâmica: alterações (data e/ou labs) -->
              {valoralteracoes}
{{FOOTER}}
