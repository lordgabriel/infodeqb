<!-- EMAIL_SUBTITLE: Cancelamento de Acessos -->
{{HEADER}}
              <p style="margin:0 0 12px 0;font-size:16px;line-height:24px;font-family:Arial,sans-serif;">Caro(a) colega,</p>
              <p style="margin:0 0 16px 0;font-size:16px;line-height:24px;font-family:Arial,sans-serif;">Vimos por este meio solicitar que sejam cancelados os seguintes acessos no edifício E (DEQ):</p>

              <table border="0" cellpadding="3" cellspacing="0" style="color:#000000;font-family:Arial,sans-serif;font-size:15px;line-height:22px;width:100%;margin-bottom:16px;">
                <tbody>
                  <tr>
                    <th align="left" style="background-color:#2475ba;color:#ffffff;padding:8px;">Código</th>
                    <th align="left" style="background-color:#2475ba;color:#ffffff;padding:8px;">Nome</th>
                    <th align="left" style="background-color:#2475ba;color:#ffffff;padding:8px;">Acessos</th>
                    <th align="left" style="background-color:#2475ba;color:#ffffff;padding:8px;">Data Fim</th>
                    <th align="left" style="background-color:#2475ba;color:#ffffff;padding:8px;">Responsável</th>
                  </tr>
                  <tr>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorcodigo}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valornome}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valoracessos}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorfim}</td>
                    <td style="padding:8px;border-bottom:1px solid #eee;">{valorresponsavel}</td>
                  </tr>
                </tbody>
              </table>
{{FOOTER}}
